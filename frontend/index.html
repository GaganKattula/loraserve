<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LoRA Serve — Training Monitor</title>

<!-- Chart.js loaded from CDN — no npm, no build step, matches the
     project's "single HTML file, no framework" tech stack decision -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>

<style>
  body {
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    max-width: 720px;
    margin: 40px auto;
    padding: 0 20px;
    color: #222;
  }
  h1 {
    font-size: 20px;
  }
  #controls {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  #jobIdInput {
    flex: 1;
    padding: 8px;
    font-family: monospace;
  }
  button {
    padding: 8px 16px;
    cursor: pointer;
  }
  #status {
    margin-bottom: 16px;
    padding: 8px;
    font-family: monospace;
    font-size: 14px;
    background: #f0f0f0;
    border-radius: 4px;
  }
  #status.streaming { background: #e3f2e1; }
  #status.done      { background: #e1ecf7; }
  #status.error      { background: #fbe1e1; }
</style>
</head>
<body>

<h1>LoRA Serve — Training Monitor</h1>

<div id="controls">
  <input id="jobIdInput" type="text" placeholder="Paste job_id here">
  <button id="watchButton">Watch</button>
</div>

<div id="status">Idle — enter a job_id and click Watch</div>

<canvas id="lossChart" height="300"></canvas>

<script>
  // ── Grab references to the HTML elements we declared above ──────────
  // This is the JS equivalent of "SELECT element FROM page WHERE id = ..."
  const jobIdInput  = document.getElementById('jobIdInput');
  const watchButton = document.getElementById('watchButton');
  const statusEl    = document.getElementById('status');
  const chartCanvas = document.getElementById('lossChart');

  // ── Set up the Chart.js line chart — starts empty, fills in live ────
  const chart = new Chart(chartCanvas, {
    type: 'line',
    data: {
      datasets: [
        {
          label: 'train_loss',
          data: [],            // array of {x, y} points — empty until events arrive
          borderColor: '#2E75B6',
          backgroundColor: 'transparent',
          pointRadius: 2,
          tension: 0.1,
        },
        {
          label: 'eval_loss',
          data: [],
          borderColor: '#D85A30',
          backgroundColor: 'transparent',
          pointRadius: 4,
          showLine: false,      // eval points shown as markers, not connected
        }
      ]
    },
    options: {
      responsive: true,
      scales: {
        x: { type: 'linear', title: { display: true, text: 'step' } },
        y: { title: { display: true, text: 'loss' } }
      }
    }
  });

  // Track the running step count so eval events (which carry epoch, not
  // step) can still be placed on the same x-axis as step events.
  let currentStep = 0;

  // Keep a reference to the active EventSource so we can close it if the
  // user clicks Watch again on a different job_id without refreshing the page.
  let activeStream = null;

  function setStatus(text, cssClass) {
    statusEl.textContent = text;
    statusEl.className = cssClass || '';
  }

  watchButton.addEventListener('click', () => {
    const jobId = jobIdInput.value.trim();
    if (!jobId) {
      setStatus('Enter a job_id first', 'error');
      return;
    }

    // If a previous stream is still open, close it before starting a new one
    if (activeStream) {
      activeStream.close();
    }

    // Reset chart data for the new job
    chart.data.datasets[0].data = [];
    chart.data.datasets[1].data = [];
    chart.update();
    currentStep = 0;

    setStatus(`Connecting to job ${jobId}...`, '');

    // ── The actual SSE connection — browser-native, no library needed ──
    const stream = new EventSource(`/jobs/${jobId}/stream`);
    activeStream = stream;

    stream.onopen = () => {
      setStatus(`Streaming job ${jobId}`, 'streaming');
    };

    stream.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if (data.type === 'step') {
        currentStep = data.step;
        chart.data.datasets[0].data.push({ x: data.step, y: data.train_loss });
        chart.update();
      }

      else if (data.type === 'eval') {
        // eval events don't carry a step value — plot at the current step
        // so it lines up visually with the step events from that epoch
        chart.data.datasets[1].data.push({ x: currentStep, y: data.eval_loss });
        chart.update();
        setStatus(`Job ${jobId} — epoch ${data.epoch} eval_loss=${data.eval_loss.toFixed(4)}`, 'streaming');
      }

      else if (data.type === 'done') {
        setStatus(`Job ${jobId} — done (${data.status}), final eval_loss=${data.eval_loss.toFixed(4)}`, 'done');
        stream.close();
        activeStream = null;
      }
    };

    stream.onerror = () => {
      setStatus(`Connection error on job ${jobId}`, 'error');
      stream.close();
      activeStream = null;
    };
  });
</script>

</body>
</html>
