# LoRA Serve — Nginx reverse proxy
#
# Architecture decision: Why Nginx in front of Uvicorn?
#
# 1. TLS termination — Uvicorn can do TLS but Nginx is battle-tested for it,
#    handles cert rotation (certbot), and supports OCSP stapling.
#
# 2. Rate limiting — Nginx's limit_req module is a proven, low-overhead way
#    to throttle abusive clients before they reach the Python process. Without
#    it, a single client could saturate the RQ queue with training jobs.
#
# 3. SSE passthrough — Server-Sent Events require proxy_buffering off.
#    If Nginx buffers the response, the client sees nothing until the stream
#    ends (defeats the purpose). X-Accel-Buffering: no is the same signal
#    from the upstream side (FastAPI already sets this header).
#
# 4. Static file serving — Nginx serves the frontend HTML/JS directly,
#    bypassing the Python process entirely.

# Rate limit zones — shared memory, keyed by client IP
limit_req_zone $binary_remote_addr zone=jobs:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=infer:10m rate=10r/s;

upstream api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # In production, uncomment to redirect HTTP → HTTPS:
    # return 301 https://$host$request_uri;

    # ── Health check (no rate limit) ──
    location /health {
        proxy_pass http://api;
    }

    # ── Job submission (rate limited) ──
    location /jobs {
        limit_req zone=jobs burst=10 nodelay;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SSE stream — MUST disable buffering ──
    #
    # Without these directives, Nginx buffers the chunked response and the
    # client sees no events until the stream closes. This is the #1 SSE
    # debugging pitfall behind a reverse proxy.
    location ~ ^/jobs/[0-9a-f-]+/stream$ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Disable all buffering for SSE
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;

        # Long timeout — SSE streams can last minutes during training
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Inference (rate limited) ──
    location /infer {
        limit_req zone=infer burst=20 nodelay;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Chat inference (rate limited, longer timeout for multi-turn) ──
    location /chat {
        limit_req zone=infer burst=20 nodelay;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Frontend SPA (catch-all — must be last) ──
    location / {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

