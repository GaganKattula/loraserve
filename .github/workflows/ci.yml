name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: loraserve
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: loraserve_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://loraserve:testpass@localhost:5432/loraserve_test
      REDIS_URL: redis://localhost:6379
      S3_BUCKET: test-bucket
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_DEFAULT_REGION: us-east-1
      BASE_MODEL: gpt2
      DEVICE: cpu
      GPU_SHARED_SECRET: ""
      SQS_QUEUE_URL: ""
      ORCHESTRATOR_LAMBDA_NAME: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements-vps.txt
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest tests/ -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and build frontend
        run: cd frontend && npm ci && npm run build

  validate-datasets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSONL datasets
        run: |
          python3 -c "
          import json, sys, pathlib
          errors = []
          for f in sorted(pathlib.Path('datasets').glob('*.jsonl')):
              lines = [l for l in f.read_text().strip().split('\n') if l.strip()]
              for i, line in enumerate(lines, 1):
                  try:
                      obj = json.loads(line)
                      if 'text' not in obj or 'label' not in obj:
                          errors.append(f'{f.name}:{i} missing text or label key')
                  except json.JSONDecodeError as e:
                      errors.append(f'{f.name}:{i} invalid JSON: {e}')
              if len(lines) < 20:
                  errors.append(f'{f.name} has only {len(lines)} examples (minimum 20)')
              print(f'{f.name}: {len(lines)} examples OK')
          if errors:
              print('\nERRORS:')
              for e in errors:
                  print(f'  {e}')
              sys.exit(1)
          print('\nAll datasets valid.')
          "

  docker:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: loraserve:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
